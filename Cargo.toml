[package]
name        = "proconductor"
version     = "1.0.0"
edition     = "2021"
description = "Multi-component process orchestrator — run as: proconductor [config.json]"
license     = "MIT OR Apache-2.0"

[[bin]]
name = "proconductor"
path = "src/main.rs"

[dependencies]
# egui/eframe: self-contained OpenGL GUI — no WebView, no runtime
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",                # OpenGL renderer, available everywhere
] }
egui = "0.27"

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }

# Local-time timestamps for the log viewer and {date} expansion
chrono = "0.4"

# Native file dialogs (gtk3 on Linux, Cocoa on macOS, Win32 on Windows)
rfd = "0.14"

# Cross-platform exclusive file lock — released by OS on crash or clean exit
fs2 = "0.4"

# Cross-platform Ctrl+C / SIGTERM handler
ctrlc = { version = "3", features = ["termination"] }

# Windows-only: system tray support
[target.'cfg(windows)'.dependencies]
tray-icon = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2            = "0.6"
objc2-foundation = "0.3"
objc2-app-kit    = { version = "0.3", features = ["NSApplication", "NSImage", "NSBitmapImageRep"] }

# NOTE: no panic = "abort" — a panic in any worker thread (log reader, monitor,
# kill thread) must not take down the GUI and orphan every running child process.
[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = true
